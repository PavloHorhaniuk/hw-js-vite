<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GET /todos — JSONPlaceholder</title>
    
  <script type="module" crossorigin src="/hw-js-vite/assets/todos-28212001.js"></script>
  <link rel="modulepreload" crossorigin href="/hw-js-vite/assets/modulepreload-polyfill-3cfb730f.js">
  <link rel="stylesheet" href="/hw-js-vite/assets/common-d5bd8a77.css">
</head>

<body>
    <div class="page">
        <div class="row"><a class="btn" href="./index.html">← Назад</a></div>

        <section class="card" style="padding:16px">
            <h2 style="margin-top:0">Завдання (GET /todos)</h2>
            <p class="hint">Ендпоінт: <code>https://jsonplaceholder.typicode.com/todos</code></p>

            <div class="row">
                <input id="userId" class="input" type="number" min="1" max="10" placeholder="userId (1–10)" />
                <select id="completed" class="input">
                    <option value="">status: all</option>
                    <option value="true">completed: true</option>
                    <option value="false">completed: false</option>
                </select>
                <input id="limit" class="input" type="number" min="1" max="200" step="1" value="20" />
                <button id="load" class="btn">Завантажити</button>
                <span id="status" class="msg"></span>
            </div>

            <table id="table" class="table" aria-label="Todos"></table>

            <p class="hint">Приклади для Postman:
                <br>• <code>GET https://jsonplaceholder.typicode.com/todos?_limit=10</code>
                <br>• <code>GET https://jsonplaceholder.typicode.com/todos?userId=1</code>
                <br>• <code>GET https://jsonplaceholder.typicode.com/todos?userId=1&completed=false</code>
            </p>
        </section>
    </div>

    
</body>

</html>
