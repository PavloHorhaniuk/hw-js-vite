<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Список студентів (localStorage)</title>
    
    <!-- Handlebars (глобально) -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
  <script type="module" crossorigin src="/hw-js-vite/assets/index-c4b791d2.js"></script>
  <link rel="modulepreload" crossorigin href="/hw-js-vite/assets/modulepreload-polyfill-3cfb730f.js">
  <link rel="stylesheet" href="/hw-js-vite/assets/index-aa13ae50.css">
</head>

<body>
    <main class="page">
        <header class="header">
            <h1>Список студентів (localStorage)</h1>
            <p class="muted">При першому запуску дані беруться з <code>students.json</code>, далі — тільки з
                <code>localStorage["students"]</code>.</p>
        </header>

        <section class="card">
            <div class="row">
                <button id="add-btn" class="btn ok">Додати студента</button>
                <button id="clear-all" class="btn danger">Очистити localStorage</button>
                <span id="status" class="status"></span>
            </div>

            <form id="student-form" class="form" hidden>
                <h3 id="form-title">Нова картка студента</h3>
                <div class="grid">
                    <label>Ім'я<input id="firstName" class="input" type="text" required /></label>
                    <label>Прізвище<input id="lastName" class="input" type="text" required /></label>
                    <label>Вік<input id="age" class="input" type="number" min="14" max="100" required /></label>
                    <label>Курс<input id="course" class="input" type="number" min="1" max="10" required /></label>
                    <label>Факультет<input id="faculty" class="input" type="text" required /></label>
                </div>
                <div class="row">
                    <button type="submit" class="btn ok" id="save-btn">Зберегти</button>
                    <button type="button" class="btn" id="cancel-btn">Скасувати</button>
                </div>
                <input type="hidden" id="edit-index" value="" />
            </form>
        </section>

        <p class="muted">Нижче список рендериться ТІЛЬКИ з <code>localStorage["students"]</code>.</p>
        <ul id="students-list" class="list"></ul>
    </main>

    <script id="tpl-students" type="text/x-handlebars-template">
    {{#each students}}
    <li class="student-card" data-index="{{@index}}">
      <div class="student-header">
        <div>
          <div class="student-name">{{firstName}} {{lastName}}</div>
          <div class="student-meta">
            Вік: {{age}} · Курс: {{course}} · Факультет: {{faculty}}
          </div>
        </div>
        <div class="actions">
          <button class="btn edit">Edit</button>
          <button class="btn danger delete">Delete</button>
        </div>
      </div>
      <div class="confirm hidden">
        <span>Видалити картку?</span>
        <button class="btn yes">Так</button>
        <button class="btn no">Ні</button>
      </div>
    </li>
    {{/each}}
    </script>


    
</body>

</html>
