<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Завдання 1 — 1 година → хвилини</title>
    <link rel="stylesheet" href="./common.css" />
</head>

<body>
    <div class="page">
        <div class="breadcrumbs"><a class="back" href="./index.html">← Назад</a></div>

        <section class="card">
            <header>
                <h2>Завдання 1</h2>
            </header>
            <div class="content">
                <p class="hint">
                    Створити таймер, який починає відлік з <strong>1 години</strong> і <strong>зменшує час кожну
                        хвилину</strong>.
                    При досягненні <strong>30 хв</strong> — показати повідомлення, що залишилось менше половини часу.
                </p>

                <div class="big-timer" id="t1-time" aria-live="polite">01:00</div>
                <div class="note" id="t1-note"></div>

                <div class="row">
                    <button class="btn ok" id="t1-start">Старт</button>
                    <button class="btn warn" id="t1-pause" disabled>Пауза</button>
                    <button class="btn" id="t1-reset">Скинути</button>
                </div>

                <div class="log" id="t1-log" aria-live="polite"></div>
            </div>
        </section>
    </div>

    <script src="./task1.js" type="module" defer></script>
</body>

</html>
